<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>penguin-forge</title>
  <!-- Fonts vendored locally (public/vendor/) — no CDN, runs fully offline,
       matching the dashboards. Manrope is a variable font (400–800); the
       landing's heaviest headings clamp to 800 (Manrope's max axis weight). -->
  <link rel="stylesheet" href="vendor/fonts.css">
  <link rel="stylesheet" href="redesign/landings-scroll.css?v=2">
  <style>
    html, body {
      margin: 0; padding: 0;
      height: 100vh; width: 100vw;
      background: #070d18;
      overflow: hidden;
      font-family: 'Manrope', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    /* Outer stage: full viewport, anchors the fixed-size landing to the
       top so width-fit scaling reveals the page top-down. */
    #stage {
      position: fixed; inset: 0;
      overflow: hidden;
    }
    /* The landing renders at its native 1440×900. JS sets a width-fit
       scale on every resize so the page always fills the viewport edge to
       edge with no side bars. Anything that doesn't fit vertically is
       reached via the LandingScrollFade's internal scroll. */
    #landing-fixed {
      width: 1440px; height: 900px;
      transform-origin: top left;
      position: absolute;
      top: 0; left: 0;
      will-change: transform;
    }
  </style>

  <!-- React vendored locally (no CDN) — the page runs fully offline. -->
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
</head>
<body>
  <template id="__bundler_thumbnail">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <rect width="100" height="100" fill="#070d18" />
      <circle cx="50" cy="50" r="20" fill="#ffb84e" />
      <path d="M 50 38 C 60 38 62 44 62 52 C 62 60 56 64 50 64 C 44 64 38 60 38 52 C 38 44 40 38 50 38 Z" fill="#3b82f6" />
      <ellipse cx="50" cy="54" rx="6" ry="8" fill="#fff" />
      <circle cx="47" cy="48" r="1.5" fill="#16181f" />
      <circle cx="53" cy="48" r="1.5" fill="#16181f" />
      <text x="50" y="86" text-anchor="middle" font-family="ui-monospace, monospace" font-size="7" fill="#ffb84e" font-weight="700">penguin-forge</text>
    </svg>
  </template>

  <div id="stage">
    <div id="landing-fixed">
      <div id="root"></div>
    </div>
  </div>

  <!-- palettes + components used by LandingScrollFade. Pre-compiled from JSX
       to plain JS at build time (see redesign/*.jsx for source), so no
       in-browser Babel and no CDN are needed. -->
  <script src="redesign/palettes.js?v=2"></script>
  <script src="redesign/penguin.js?v=2"></script>
  <script src="redesign/rooms-outside.js?v=2"></script>
  <script src="redesign/landings.js?v=2"></script>
  <script src="redesign/landings-scroll.js?v=2"></script>
  <script src="redesign/app.js?v=2"></script>
</body>
</html>
